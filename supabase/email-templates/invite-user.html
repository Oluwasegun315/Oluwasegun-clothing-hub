<!-- Subject: You're invited to Oluwasegun Clothing Hub -->
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#fff7ed;margin:0;padding:32px 16px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border:1px solid #fed7aa;border-radius:16px;overflow:hidden;">
        <tr>
          <td style="background:#ea580c;padding:28px 32px;text-align:center;">
            <p style="margin:0;font-size:11px;letter-spacing:0.35em;color:#fff7ed;font-weight:600;">OLUWASEGUN</p>
            <p style="margin:6px 0 0;font-size:10px;letter-spacing:0.55em;color:#ffedd5;">CLOTHING HUB</p>
          </td>
        </tr>
        <tr>
          <td style="padding:32px;color:#9a3412;">
            <h1 style="margin:0 0 12px;font-size:22px;font-weight:700;color:#ea580c;">You're invited</h1>
            <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#9a3412;">
              You've been invited to join Oluwasegun Clothing Hub. Accept the invite to access the marketplace, cart, and your profile.
            </p>
            <p style="margin:0 0 28px;text-align:center;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#ea580c;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:14px 32px;border-radius:999px;">Accept invite</a>
            </p>
            <p style="margin:0;font-size:12px;line-height:1.6;color:#c2410c;word-break:break-all;">
              Or copy this link:<br />
              <a href="{{ .ConfirmationURL }}" style="color:#ea580c;">{{ .ConfirmationURL }}</a>
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 28px;font-size:12px;line-height:1.6;color:#c2410c;text-align:center;">
            If you were not expecting this invite, you can ignore this email.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
